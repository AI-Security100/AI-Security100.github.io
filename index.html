<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>工作台</title>
<style>
:root{--bg:#0f1720;--card:#18222e;--line:#26313d;--fg:#e8eef5;--dim:#8fa3b5;--acc:#3fbf8f}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--fg);
  font:16px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  padding:28px 18px calc(28px + env(safe-area-inset-bottom))}
.wrap{max-width:560px;margin:0 auto}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
.sub{color:var(--dim);font-size:13px;margin:0 0 22px}
ul{list-style:none;margin:0;padding:0}
li{margin:0 0 10px}
a{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;color:var(--fg);text-decoration:none;
  -webkit-tap-highlight-color:transparent;transition:border-color .15s,transform .06s}
a:active{transform:scale(.985)}
a:hover{border-color:var(--acc)}
.t{font-size:16px;font-weight:500}
.d{color:var(--dim);font-size:12.5px;margin-top:3px}
.foot{color:#5c6b7a;font-size:12px;margin-top:26px;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <h1>工作台</h1>
  <p class="sub">临时入口 · 用毕即撤</p>
  <ul>
    <li><a href="/mytoday/"><div class="t">今日 · 我的计划中枢</div>
      <div class="d">口语 30 天 · AI 安全 12 个月 · 学业课程与截止日</div></a></li>
    <li><a href="/kai30/"><div class="t">开口 30 · 英语口语</div>
      <div class="d">30 天跟读 · 预生成音频包</div></a></li>
    <li><a href="/qindou-demo/"><div class="t">演示 · 链接 1</div>
      <div class="d">五屏原型</div></a></li>
    <li><a href="/qingdou-cloud/"><div class="t">演示 · 链接 2</div>
      <div class="d">四屏一闭环</div></a></li>
    <li><a href="/qingdou-hub/"><div class="t">演示 · 链接 3</div>
      <div class="d">融合版</div></a></li>
  </ul>
  <p class="foot">本页只列入口，无个人信息</p>
</div>
</body>
</html>
